<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CobraSets File Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>CubeCobra to Draftmancer</h1>
    <p>Upload a CubeCobra custom set CSV file to generate a Draftmancer file.</p>

    <input id="file-input" type="file" accept=".csv,text/csv" aria-label="Upload a CSV file">
    <div id="file-name">No file selected.</div>
    <label id="basic-rarities-label" style="display: none;" title="Basics will only appear if they also appear in your CubeCobra set"><input id="basic-rarities-input" type="checkbox"> Basics in packs</label>
    <div id="output-header">
      <span>Output</span>
      <div id="file-actions" style="display: none;">
        <label for="output-name-input">Set name:</label>
        <input id="output-name-input" type="text" aria-label="Output file name" placeholder="File name">
        <button id="copy-button" type="button">Copy</button>
        <button id="download-button" type="button">Download</button>
      </div>
    </div>
    <pre id="file-content">File contents will appear here.</pre>
  </main>

  <script src="csv.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
